<title>Gateway Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface2:#F5F8FA; --line:#D3DBE3; --line2:#E5EBF0;
  --ink:#10202C; --ink2:#48596A; --ink3:#7A8C9A;
  --accent:#12506B; --accent2:#1B7091; --accent-soft:#DCE9EF;
  --attB:#9E5409; --attP:#6633C0; --attL:#0A6B5C; --attR:#AF2046; --rrs:#7A5AA8;
  --attB-bg:#F6E7D4; --attP-bg:#EAE1FA; --attL-bg:#D8EEE8; --attR-bg:#FADEE4; --rrs-bg:#EDE6F7;
  --orf:#12506B; --orf-bg:#DCE9EF;
  --ok:#0A6B5C; --warn:#9E5409; --bad:#AF2046;
  --btn-fg:#FFFFFF;
  --shadow:0 1px 2px rgba(16,32,44,.06),0 8px 24px -12px rgba(16,32,44,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1418; --surface:#151E24; --surface2:#1B252C; --line:#2A3841; --line2:#222E36;
    --ink:#E3ECF1; --ink2:#9DB0BD; --ink3:#6B8190;
    --accent:#5EC2D6; --accent2:#7FD4E4; --accent-soft:#12303B;
    --attB:#E3A65C; --attP:#B59AF0; --attL:#4FC9AD; --attR:#F0879E; --rrs:#C0A8EE;
    --attB-bg:#39280F; --attP-bg:#2B2148; --attL-bg:#0E3A33; --attR-bg:#401824; --rrs-bg:#2A2244;
    --orf:#5EC2D6; --orf-bg:#12303B;
    --ok:#4FC9AD; --warn:#E3A65C; --bad:#F0879E;
    --btn-fg:#07171D;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1418; --surface:#151E24; --surface2:#1B252C; --line:#2A3841; --line2:#222E36;
  --ink:#E3ECF1; --ink2:#9DB0BD; --ink3:#6B8190;
  --accent:#5EC2D6; --accent2:#7FD4E4; --accent-soft:#12303B;
  --attB:#E3A65C; --attP:#B59AF0; --attL:#4FC9AD; --attR:#F0879E; --rrs:#C0A8EE;
  --attB-bg:#39280F; --attP-bg:#2B2148; --attL-bg:#0E3A33; --attR-bg:#401824; --rrs-bg:#2A2244;
  --orf:#5EC2D6; --orf-bg:#12303B;
  --ok:#4FC9AD; --warn:#E3A65C; --bad:#F0879E;
  --btn-fg:#07171D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;font-weight:600;letter-spacing:.01em}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
button{font:inherit;color:inherit}
a{color:var(--accent2)}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1220px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.brand .mark{width:22px;height:22px;flex:none;align-self:center}
.brand h1{font-size:17px;letter-spacing:.02em}
.brand .sub{font-size:11px;color:var(--ink3);letter-spacing:.09em;text-transform:uppercase;font-family:"IBM Plex Sans Condensed",sans-serif}
.tabs{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:3px;overflow-x:auto;max-width:100%}
.tab{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--ink2);
  font-size:13px;font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tab:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,label.file:focus-within{outline:2px solid var(--accent2);outline-offset:2px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:32px;height:32px;cursor:pointer;
  display:grid;place-items:center;color:var(--ink2)}
main{max-width:1220px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}

.split{display:grid;grid-template-columns:352px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.panel + .panel{margin-top:16px}
.panel-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.panel-hd h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.panel-hd .spacer{margin-left:auto}
.panel-bd{padding:14px}
.stack{display:flex;flex-direction:column;gap:13px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

label.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink2);font-weight:500}
.hint{font-size:11.5px;color:var(--ink3);line-height:1.45;margin:0}
select,textarea,input[type=text],input[type=number]{width:100%;background:var(--surface2);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:8px 9px;font:inherit;font-size:13px}
textarea{font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.6;resize:vertical;min-height:104px;letter-spacing:.02em}
.check{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink);cursor:pointer;font-weight:400}
.check input{margin:2px 0 0;accent-color:var(--accent2);flex:none}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--btn-fg);border-radius:8px;padding:9px 14px;
  font-weight:600;font-size:13px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:12px;font-weight:500}
.btn.danger{background:transparent;border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.file{display:inline-flex;align-items:center;gap:7px;border:1px dashed var(--line);border-radius:8px;
  padding:8px 12px;font-size:12.5px;color:var(--ink2);cursor:pointer;background:var(--surface2)}
label.file input{display:none}
label.file:hover{border-color:var(--accent2);color:var(--ink)}

.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1 1 0;min-width:0;border:0;background:var(--surface2);padding:7px 8px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button + button{border-left:1px solid var(--line)}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;
  font-family:"IBM Plex Mono",monospace;letter-spacing:.02em;border:1px solid transparent}
.c-B{color:var(--attB);background:var(--attB-bg);border-color:color-mix(in srgb,var(--attB) 35%,transparent)}
.c-P{color:var(--attP);background:var(--attP-bg);border-color:color-mix(in srgb,var(--attP) 35%,transparent)}
.c-L{color:var(--attL);background:var(--attL-bg);border-color:color-mix(in srgb,var(--attL) 35%,transparent)}
.c-R{color:var(--attR);background:var(--attR-bg);border-color:color-mix(in srgb,var(--attR) 35%,transparent)}
.c-O{color:var(--orf);background:var(--orf-bg);border-color:color-mix(in srgb,var(--orf) 32%,transparent)}
.c-N{color:var(--ink2);background:var(--surface2);border-color:var(--line)}

.note{border-left:3px solid var(--line);padding:2px 0 2px 11px;font-size:12.5px;color:var(--ink2)}
.note.ok{border-color:var(--ok)} .note.warn{border-color:var(--warn)} .note.bad{border-color:var(--bad)}
.note b{color:var(--ink)}

.eq{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px}
.eq .op{color:var(--ink3);font-size:15px}
.eq .box{border:1px solid var(--line);border-radius:8px;padding:7px 11px;background:var(--surface2);min-width:0}
.eq .box .t{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);
  font-family:"IBM Plex Sans Condensed",sans-serif}
.eq .box .v{font-weight:600;font-size:13px}

.seqwrap{border:1px solid var(--line2);border-radius:9px;background:var(--surface2);overflow-x:auto}
.seq{font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.75;white-space:pre;padding:11px 12px;min-width:min-content;letter-spacing:.04em}
.seq .n{color:var(--ink3);user-select:none}
.seq .sB{color:var(--attB);background:var(--attB-bg)}
.seq .sP{color:var(--attP);background:var(--attP-bg)}
.seq .sL{color:var(--attL);background:var(--attL-bg)}
.seq .sR{color:var(--attR);background:var(--attR-bg)}
.seq .sK{color:var(--rrs);background:var(--rrs-bg)}
.seq .sO{color:var(--orf);background:var(--orf-bg)}
.seq .sC{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.seq .sX{color:var(--ink2)}
.aa{font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.7;word-break:break-all;letter-spacing:.06em;padding:11px 12px}

.tablewrap{overflow-x:auto;border:1px solid var(--line2);border-radius:9px;max-height:520px}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:660px}
th{text-align:left;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3);font-weight:600;padding:9px 11px;border-bottom:1px solid var(--line);background:var(--surface2);position:sticky;top:0}
td{padding:8px 11px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr[data-vec]{cursor:pointer}
tbody tr[data-vec]:hover{background:var(--surface2)}
tbody tr[aria-selected="true"]{background:var(--accent-soft)}
td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.vname{font-weight:600;white-space:nowrap}

.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:0}
.kv dt{color:var(--ink3);font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-family:"IBM Plex Sans Condensed",sans-serif;padding-top:2px}
.kv dd{margin:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
ol.proto{margin:0;padding-left:20px;font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
ol.proto b{color:var(--ink)}
ul.tight{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:5px}
.pill{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:1px 6px;border-radius:5px;background:var(--surface2);
  border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill.on{background:var(--accent-soft);border-color:var(--accent2);color:var(--accent)}
.copied{color:var(--ok);font-size:11.5px;font-weight:600}
.svgmap{display:block;width:100%;height:auto;max-width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{width:auto;min-width:130px}
.hist{display:flex;flex-direction:column;gap:0}
.hrow{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.hrow:last-child{border-bottom:0}
.hrow .meta{flex:1 1 220px;min-width:0}
.hrow .when{font-size:11px;color:var(--ink3);font-family:"IBM Plex Mono",monospace}
.empty{color:var(--ink3);font-size:12.5px;padding:22px 0;text-align:center}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .22s ease}}
@keyframes f{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
</style>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" opacity=".35"></circle>
        <path d="M3.6 9.2h7.2a3.2 3.2 0 0 1 0 6.4H3.4" stroke="var(--attL)" stroke-width="2" stroke-linecap="round"></path>
        <path d="M20.4 14.8h-7.2a3.2 3.2 0 0 1 0-6.4h7.4" stroke="var(--attB)" stroke-width="2" stroke-linecap="round"></path>
      </svg>
      <h1>Gateway Bench</h1>
      <span class="sub">BP · LR · vectors</span>
    </div>
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="bp" aria-selected="true">BP reaction</button>
      <button class="tab" role="tab" data-tab="lr" aria-selected="false">LR reaction</button>
      <button class="tab" role="tab" data-tab="lib" aria-selected="false">Vector library</button>
      <button class="tab" role="tab" data-tab="hist" aria-selected="false">History</button>
      <button class="tab" role="tab" data-tab="att" aria-selected="false">att sites</button>
    </div>
    <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle light and dark theme">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z" fill="none"></path>
      </svg>
    </button>
  </div>
</header>

<main>
  <section id="view-bp" class="fade"></section>
  <section id="view-lr" class="fade" hidden></section>
  <section id="view-lib" class="fade" hidden></section>
  <section id="view-hist" class="fade" hidden></section>
  <section id="view-att" class="fade" hidden></section>
</main>

<script>

/* ==== core.js ==== */
/* ============================ att site sequences ============================ */
const ATT = {
  B1:"ACAAGTTTGTACAAAAAAGCAGGCT",
  B2:"ACCCAGCTTTCTTGTACAAAGTGGT",
  L1:"CAAATAATGATTTTATTTTGACTGATAGTGACCTGTTCGTTGCAACAAATTGATAAGCAATGCTTTTTTATAATGCCAACTTTGTACAAAAAAGCAGGCT",
  L2:"ACCCAGCTTTCTTGTACAAAGTTGGCATTATAAGAAAGCATTGCTTATCAATTTGTTGCAACGAACAGGTCACTATCAGTCAAAATAAAATCATTATTTG",
  R1:"ACAAGTTTGTACAAAAAAGCTGAACGAGAAACGTAAAATGATATAAATATCAATATATTAAATTAGATTTTGCATAAAAAACAGACTACATAATACTGTAAAACACAACATATCCAGTCACTATG",
  R2:"CATAGTGACTGGATATGTTGTGTTTTACAGTATTATGTAGTCTGTTTTTTATGCAAAATCTAATTTAATATATTGATATTTATATCATTTTACGTTTCTCGTTCAGCTTTCTTGTACAAAGTGGT"
};
const CORE = {1:"TTTGTACAAAAAAGC", 2:"TTTGTACAAGAAAGC"};
const SEQ_PRIMERS = [
  {name:"SeqL-A", seq:"TCGCGTTAACGCTAGCATGGATCTC", note:"proximal to attL1 · 106 nt from the cloned ORF"},
  {name:"SeqL-B", seq:"GTAACATCAGAGATTTTGAGACAC", note:"proximal to attL2 · 123 nt from the cloned ORF"},
  {name:"M13 forward", seq:"GTAAAACGACGGCCAG", note:"pDONR221 and most pENTR backbones"},
  {name:"M13 reverse", seq:"CAGGAAACAGCTATGAC", note:"pDONR221 and most pENTR backbones"}
];

/* ============================ sample ORF ============================ */
const SAMPLE_ORF =
"ATGGTGAGCAAGGGCGAGGAGCTGTTCACCGGGGTGGTGCCCATCCTGGTCGAGCTGGACGGCGACGTAAACGGCCACAAGTTCAGCGTGTCCGGCGAGGGC"+
"GAGGGCGATGCCACCTACGGCAAGCTGACCCTGAAGTTCATCTGCACCACCGGCAAGCTGCCCGTGCCCTGGCCCACCCTCGTGACCACCCTGACCTACGGC"+
"GTGCAGTGCTTCAGCCGCTACCCCGACCACATGAAGCAGCACGACTTCTTCAAGTCCGCCATGCCCGAAGGCTACGTCCAGGAGCGCACCATCTTCTTCAAG"+
"GACGACGGCAACTACAAGACCCGCGCCGAGGTGAAGTTCGAGGGCGACACCCTGGTGAACCGCATCGAGCTGAAGGGCATCGACTTCAAGGAGGACGGCAAC"+
"ATCCTGGGGCACAAGCTGGAGTACAACTACAACAGCCACAACGTCTATATCATGGCCGACAAGCAGAAGAACGGCATCAAGGTGAACTTCAAGATCCGCCAC"+
"AACATCGAGGACGGCAGCGTGCAGCTCGCCGACCACTACCAGCAGAACACCCCCATCGGCGACGGCCCCGTGCTGCTGCCCGACAACCACTACCTGAGCACC"+
"CAGTCCGCCCTGAGCAAAGACCCCAACGAGAAGCGCGATCACATGGTCCTGCTGGAGTTCGTGACCGCCGCCGGGATCACTCTCGGCATGGACGAGCTGTAC"+
"AAGTAA";

/* ============================ sequence utils ============================ */
const CODON_AA = "FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG";
const B4 = "TCAG";
function clean(s){return (s||"").toUpperCase().replace(/[^ACGTUN]/g,"").replace(/U/g,"T");}
function rc(s){const m={A:"T",T:"A",G:"C",C:"G",N:"N"};return s.split("").reverse().map(c=>m[c]||"N").join("");}
function translate(s){let out="";for(let i=0;i+2<s.length;i+=3){const a=B4.indexOf(s[i]),b=B4.indexOf(s[i+1]),c=B4.indexOf(s[i+2]);
  out += (a<0||b<0||c<0) ? "X" : CODON_AA[16*a+4*b+c];}return out;}
function gcPct(s){if(!s.length)return 0;return 100*(s.match(/[GC]/g)||[]).length/s.length;}
function tm(s){const n=s.length;if(!n)return 0;const gc=(s.match(/[GC]/g)||[]).length;
  return n<14 ? 2*(n-gc)+4*gc : 64.9+41*(gc-16.4)/n;}
function bp(n){return n.toLocaleString("en-US")+" bp";}
function kb(n){return (n/1000).toFixed(n<10000?2:1)+" kb";}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function slug(s){return String(s).replace(/[^A-Za-z0-9_.+~:@-]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60)||"item";}

function renderSeq(segs, perLine, cap){
  perLine=perLine||60; cap=cap||6000;
  const cls=[]; let all="";
  for(const s of segs){ for(let i=0;i<s.seq.length;i++) cls.push(s.cls||"sX"); all+=s.seq; }
  let trimmed=false;
  if(all.length>cap){ all=all.slice(0,cap); cls.length=cap; trimmed=true; }
  const width=String(all.length).length;
  let html="";
  for(let i=0;i<all.length;i+=perLine){
    const line=all.slice(i,i+perLine), lc=cls.slice(i,i+perLine);
    let body="",cur=null,buf="";
    const flush=()=>{ if(buf){ body+='<span class="'+cur+'">'+buf+"</span>"; buf=""; } };
    for(let j=0;j<line.length;j++){
      if(j&&j%10===0){ flush(); body+=" "; }
      if(lc[j]!==cur){ flush(); cur=lc[j]; }
      buf+=line[j];
    }
    flush();
    html+='<span class="n">'+String(i+1).padStart(width," ")+"  </span>"+body+"\n";
  }
  if(trimmed) html+='<span class="n">… truncated for display — download the file for the complete sequence</span>\n';
  return '<div class="seqwrap"><div class="seq">'+html+"</div></div>";
}

/* ============================ maps ============================ */
function linearMap(feats, total){
  const W=920, H=70, pad=14, y=30, h=16;
  let s='<svg class="svgmap" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Linear construct map">';
  s+='<line x1="'+pad+'" y1="'+(y+h/2)+'" x2="'+(W-pad)+'" y2="'+(y+h/2)+'" stroke="var(--line)" stroke-width="2"></line>';
  for(const f of feats){
    const x1=pad+(W-2*pad)*(f.start/total), x2=pad+(W-2*pad)*(f.end/total);
    const w=Math.max(x2-x1,2.5);
    if(f.arrow&&w>16){
      const t=Math.min(11,w*0.28);
      s+='<path d="M'+x1+' '+y+' H'+(x1+w-t)+' L'+(x1+w)+' '+(y+h/2)+' L'+(x1+w-t)+' '+(y+h)+' H'+x1+' Z" fill="'+f.fill+'" stroke="'+f.stroke+'" stroke-width="1"></path>';
    } else {
      s+='<rect x="'+x1+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="3" fill="'+f.fill+'" stroke="'+f.stroke+'" stroke-width="1"></rect>';
    }
    const cx=x1+w/2;
    if(w>44) s+='<text x="'+cx+'" y="'+(y+h/2+4)+'" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="500" fill="'+f.stroke+'">'+esc(f.label)+"</text>";
    else s+='<text x="'+cx+'" y="'+(y-7)+'" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="'+f.stroke+'">'+esc(f.label)+"</text>";
    s+='<text x="'+cx+'" y="'+(y+h+14)+'" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="var(--ink3)">'+f.len+"</text>";
  }
  return s+"</svg>";
}
function arcPath(cx,cy,r,a1,a2,w){
  const T=(rr,a)=>[cx+rr*Math.cos(a*Math.PI/180), cy+rr*Math.sin(a*Math.PI/180)];
  const ro=r+w/2, ri=r-w/2, large=(a2-a1)>180?1:0;
  const p1=T(ro,a1),p2=T(ro,a2),p3=T(ri,a2),p4=T(ri,a1);
  return "M"+p1[0].toFixed(2)+" "+p1[1].toFixed(2)+"A"+ro+" "+ro+" 0 "+large+" 1 "+p2[0].toFixed(2)+" "+p2[1].toFixed(2)+
         "L"+p3[0].toFixed(2)+" "+p3[1].toFixed(2)+"A"+ri+" "+ri+" 0 "+large+" 0 "+p4[0].toFixed(2)+" "+p4[1].toFixed(2)+"Z";
}
function circularMap(name, total, feats){
  const S=420, cx=S/2, cy=S/2, r=124, w=17;
  let s='<svg class="svgmap" viewBox="0 0 '+S+' '+S+'" role="img" aria-label="Plasmid map of '+esc(name)+'">';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="'+w+'" opacity=".5"></circle>';
  const step=Math.max(500,Math.round(total/12/500)*500);
  for(let i=0;i<total;i+=step){
    const a=(i/total)*360-90, rad=a*Math.PI/180;
    s+='<line x1="'+(cx+(r+w/2)*Math.cos(rad)).toFixed(1)+'" y1="'+(cy+(r+w/2)*Math.sin(rad)).toFixed(1)+
       '" x2="'+(cx+(r+w/2+4)*Math.cos(rad)).toFixed(1)+'" y2="'+(cy+(r+w/2+4)*Math.sin(rad)).toFixed(1)+
       '" stroke="var(--ink3)" stroke-width="1"></line>';
  }
  const placed=[];
  for(const f of feats){
    const a1=(f.start/total)*360-90, a2=(f.end/total)*360-90;
    s+='<path d="'+arcPath(cx,cy,r,a1,Math.max(a2,a1+0.6),w)+'" fill="'+f.fill+'" stroke="'+f.stroke+'" stroke-width="1"></path>';
    let am=(a1+a2)/2;
    while(placed.some(p=>Math.abs(p-am)<7)) am+=7;
    placed.push(am);
    const rad=am*Math.PI/180;
    const lx=cx+(r+w/2+9)*Math.cos(rad), ly=cy+(r+w/2+9)*Math.sin(rad);
    const right=Math.cos(rad)>=-0.02;
    s+='<text x="'+lx.toFixed(1)+'" y="'+(ly+3.5).toFixed(1)+'" text-anchor="'+(right?"start":"end")+
       '" font-family="IBM Plex Mono, monospace" font-size="10" fill="'+f.stroke+'">'+esc(f.label)+"</text>";
  }
  const short=name.length>22?name.slice(0,21)+"…":name;
  s+='<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="15" font-weight="600" fill="var(--ink)">'+esc(short)+"</text>";
  s+='<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="var(--ink3)">'+bp(total)+"</text>";
  return s+"</svg>";
}
const FC={
  B:{fill:"var(--attB-bg)",stroke:"var(--attB)"}, P:{fill:"var(--attP-bg)",stroke:"var(--attP)"},
  L:{fill:"var(--attL-bg)",stroke:"var(--attL)"}, R:{fill:"var(--attR-bg)",stroke:"var(--attR)"},
  O:{fill:"var(--orf-bg)",stroke:"var(--orf)"},   K:{fill:"var(--rrs-bg)",stroke:"var(--rrs)"},
  N:{fill:"var(--surface2)",stroke:"var(--ink3)"}
};
function feat(label,start,end,c,arrow){return {label,start,end,len:bp(end-start),fill:FC[c].fill,stroke:FC[c].stroke,arrow:!!arrow};}
function featColorFor(label){
  if(/^attB/.test(label))return "B"; if(/^attP/.test(label))return "P";
  if(/^attL/.test(label))return "L"; if(/^attR/.test(label))return "R";
  return "N";
}

/* ============================ sequence file I/O ============================ */
function parseFasta(text){
  const out=[]; let cur=null;
  text.split(/\r?\n/).forEach(l=>{
    if(l.startsWith(">")){ cur={name:l.slice(1).trim().split(/\s+/)[0]||"sequence", desc:l.slice(1).trim(), seq:"", features:[]}; out.push(cur); }
    else if(cur) cur.seq += l.replace(/[^A-Za-z]/g,"");
  });
  out.forEach(r=>{r.seq=clean(r.seq); r.topology="linear"; r.source="FASTA";});
  return out.filter(r=>r.seq.length);
}
function parseGenBank(text){
  const recs=[];
  text.split(/^\/\//m).forEach(chunk=>{
    if(!/LOCUS/.test(chunk)) return;
    const lines=chunk.split(/\r?\n/);
    const rec={name:"sequence",desc:"",seq:"",features:[],topology:"linear",source:"GenBank"};
    const loc=lines.find(l=>l.startsWith("LOCUS"));
    if(loc){
      const p=loc.trim().split(/\s+/);
      if(p[1]) rec.name=p[1];
      if(/circular/i.test(loc)) rec.topology="circular";
    }
    const def=lines.find(l=>l.startsWith("DEFINITION"));
    if(def) rec.desc=def.replace(/^DEFINITION\s*/,"").trim();
    let mode=null, cur=null;
    for(const raw of lines){
      if(/^FEATURES/.test(raw)){ mode="feat"; continue; }
      if(/^ORIGIN/.test(raw)){ if(cur) rec.features.push(cur); cur=null; mode="seq"; continue; }
      if(/^[A-Z]/.test(raw) && mode==="feat"){ if(cur){rec.features.push(cur);cur=null;} mode=null; continue; }
      if(mode==="feat"){
        const m=raw.match(/^ {5}(\S+)\s+(\S.*)$/);
        if(m){
          if(cur) rec.features.push(cur);
          const locs=m[2].trim();
          const comp=/complement/.test(locs);
          const nums=(locs.match(/\d+/g)||[]).map(Number);
          cur={type:m[1], label:"", start:nums.length?Math.min.apply(null,nums):1,
               end:nums.length?Math.max.apply(null,nums):1, strand:comp?-1:1, join:/join/.test(locs)};
        } else if(cur){
          const q=raw.trim();
          const lm=q.match(/^\/(label|gene|product|note|standard_name|locus_tag)="?([^"]*)"?/);
          if(lm && !cur.label) cur.label=lm[2];
          else if(q.startsWith("/") && /="?$/.test(q)===false && !cur.label){}
        }
      } else if(mode==="seq"){
        rec.seq += raw.replace(/[^A-Za-z]/g,"");
      }
    }
    if(cur) rec.features.push(cur);
    rec.seq=clean(rec.seq);
    rec.features=rec.features.filter(f=>f.end<=rec.seq.length+1 && !f.join)
      .map(f=>({type:f.type,label:f.label||f.type,start:f.start,end:f.end,strand:f.strand}));
    if(rec.seq.length) recs.push(rec);
  });
  return recs;
}
function parseSeqFile(name, text){
  if(/^\s*LOCUS/m.test(text)) return parseGenBank(text);
  if(/^\s*>/.test(text)) return parseFasta(text);
  const s=clean(text);
  if(s.length>20 && s.length >= text.replace(/\s/g,"").length*0.9)
    return [{name:name.replace(/\.[^.]+$/,""),desc:"",seq:s,features:[],topology:"linear",source:"raw"}];
  return [];
}
const MONTHS=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
function gbDate(){const d=new Date();return String(d.getDate()).padStart(2,"0")+"-"+MONTHS[d.getMonth()]+"-"+d.getFullYear();}
function toGenBank(rec){
  const n=rec.seq.length;
  let s="LOCUS       "+(rec.name||"construct").slice(0,24).padEnd(24," ")+String(n).padStart(7," ")+" bp    DNA     "+
        (rec.topology==="circular"?"circular":"linear  ")+" SYN "+gbDate()+"\n";
  s+="DEFINITION  "+(rec.desc||rec.name||"Gateway construct")+"\n";
  s+="ACCESSION   .\nVERSION     .\nKEYWORDS    .\nSOURCE      synthetic DNA construct\n";
  s+="  ORGANISM  synthetic DNA construct\n";
  s+="COMMENT     Generated by Gateway Bench.\n";
  s+="FEATURES             Location/Qualifiers\n";
  (rec.features||[]).forEach(f=>{
    const loc=(f.strand===-1?"complement("+f.start+".."+f.end+")":f.start+".."+f.end);
    s+="     "+String(f.type||"misc_feature").slice(0,15).padEnd(16," ")+loc+"\n";
    s+="                     /label=\""+String(f.label||"").replace(/"/g,"'")+"\"\n";
    if(f.note) s+="                     /note=\""+String(f.note).replace(/"/g,"'")+"\"\n";
  });
  s+="ORIGIN\n";
  const seq=rec.seq.toLowerCase();
  for(let i=0;i<seq.length;i+=60){
    let line=String(i+1).padStart(9," ");
    for(let j=0;j<60;j+=10){ const part=seq.slice(i+j,i+j+10); if(part) line+=" "+part; }
    s+=line+"\n";
  }
  return s+"//\n";
}
function toFastaText(name, seq){
  let s=">"+name+"\n";
  for(let i=0;i<seq.length;i+=70) s+=seq.slice(i,i+70)+"\n";
  return s;
}

/* ============================ minimal store-only ZIP ============================ */
const CRC_T=(function(){const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;
  for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){ // files: [{name, text}]
  const enc=new TextEncoder(); const chunks=[]; const central=[]; let offset=0;
  const u16=v=>[v&255,(v>>8)&255], u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  const now=new Date();
  const dosTime=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1))&0xFFFF;
  const dosDate=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate())&0xFFFF;
  files.forEach(f=>{
    const nameB=enc.encode(f.name), dataB=enc.encode(f.text), crc=crc32(dataB);
    const local=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(dosTime),u16(dosDate),
      u32(crc),u32(dataB.length),u32(dataB.length),u16(nameB.length),u16(0));
    chunks.push(new Uint8Array(local), nameB, dataB);
    central.push({nameB,crc,size:dataB.length,offset});
    offset += local.length + nameB.length + dataB.length;
  });
  const cdStart=offset; let cdLen=0;
  central.forEach(c=>{
    const h=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(dosTime),u16(dosDate),
      u32(c.crc),u32(c.size),u32(c.size),u16(c.nameB.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(c.offset));
    chunks.push(new Uint8Array(h), c.nameB);
    cdLen += h.length + c.nameB.length;
  });
  chunks.push(new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(central.length),u16(central.length),
    u32(cdLen),u32(cdStart),u16(0))));
  return new Blob(chunks,{type:"application/zip"});
}

/* ==== lib2.js ==== */
/* ============================ att detection & recombination ============================ */
const M1 = "TTTGTACAAAAAAGC";   // att1 core, top strand
const M2 = "GCTTTCTTGTACAAA";   // att2 core, top strand (rev-comp orientation)
const B1L="ACAAG", B1R="AGGCT", B2L="ACCCA", B2R="GTGGT";

function siteType(seq, i, which){
  const L=seq.slice(Math.max(0,i-5), i), R=seq.slice(i+15, i+20);
  const bl = which===1 ? L===B1L : L===B2L;
  const br = which===1 ? R===B1R : R===B2R;
  if(bl&&br) return "B";
  if(!bl&&br) return which===1?"L":"R";
  if(bl&&!br) return which===1?"R":"L";
  return "P";
}
function rotate(rec, off){
  const n=rec.seq.length;
  const seq=rec.seq.slice(off)+rec.seq.slice(0,off);
  const feats=(rec.features||[]).map(f=>{
    let s=f.start-1-off, e=f.end-1-off;
    if(s<0)s+=n; if(e<0)e+=n;
    if(e<s) return null;                       // feature straddles the new origin: drop it
    return {type:f.type,label:f.label,start:s+1,end:e+1,strand:f.strand};
  }).filter(Boolean);
  return Object.assign({},rec,{seq,features:feats});
}
/* Locate the two att cores; rotate a circular vector so site 1 precedes site 2. */
function findSites(rec){
  let r=rec;
  let i1=r.seq.indexOf(M1), i2=r.seq.indexOf(M2);
  if(i1<0||i2<0){
    const rcRec=Object.assign({},rec,{seq:rc(rec.seq),features:(rec.features||[]).map(f=>({
      type:f.type,label:f.label,start:rec.seq.length-f.end+1,end:rec.seq.length-f.start+1,strand:-f.strand}))});
    const j1=rcRec.seq.indexOf(M1), j2=rcRec.seq.indexOf(M2);
    if(j1>=0&&j2>=0){ r=rcRec; i1=j1; i2=j2; r.flipped=true; }
    else return {error:(i1<0&&i2<0)?"No Gateway att core sequence found in this sequence."
      :(i1<0?"Found an att2 core but no att1 core.":"Found an att1 core but no att2 core.")};
  }
  if(i1>i2){
    if(r.topology!=="circular") return {error:"att sites are in the wrong order for a linear sequence — att1 must precede att2."};
    r=rotate(r, Math.max(0,i1-60));
    i1=r.seq.indexOf(M1); i2=r.seq.indexOf(M2);
    if(i1<0||i2<0||i1>i2) return {error:"Could not orient the att cassette on this circular sequence."};
  }
  const t1=siteType(r.seq,i1,1), t2=siteType(r.seq,i2,2);
  const role = (t1==="P"&&t2==="P")?"donor" : (t1==="L"&&t2==="L")?"entry"
             : (t1==="R"&&t2==="R")?"dest"  : (t1==="B"&&t2==="B")?"expression" : "mixed";
  return {rec:r, i1, i2, t1, t2, role, cassetteBp:(i2+15)-(i1)};
}
const SITE_ARM = {B:5, L:80, R:110, P:110};   // bp of each site lying outside the 15-bp core, upstream side
/* Swap the region between the two cores for a new insert. Works for BP (donor) and LR (destination). */
function recombine(rec, sites, mid, insertLabel){
  const s=sites.rec.seq, i1=sites.i1, i2=sites.i2;
  const left=s.slice(0,i1), right=s.slice(i2+15);
  const core=M1+B1R+mid+B2L+M2;
  const seq=left+core+right;
  const oldLen=(i2+15)-i1, newLen=core.length, delta=newLen-oldLen;
  const feats=[];
  (sites.rec.features||[]).forEach(f=>{
    if(f.end<=i1) feats.push(Object.assign({},f));
    else if(f.start-1>=i2+15) feats.push(Object.assign({},f,{start:f.start+delta,end:f.end+delta}));
    // features overlapping the cassette are the ccdB/Cm markers being replaced — dropped
  });
  // annotate the two new att sites and the insert (1-based inclusive)
  const p1 = sites.t1==="B" ? "attL1" : (sites.t1==="P" ? "attL1" : (sites.t1==="R" ? "attB1" : "attB1"));
  const p2 = sites.t1==="P" ? "attL2" : "attB2";
  const name1 = sites.role==="donor" ? "attL1" : sites.role==="dest" ? "attB1" : (sites.t1==="P"?"attL1":"attB1");
  const name2 = sites.role==="donor" ? "attL2" : sites.role==="dest" ? "attB2" : (sites.t2==="P"?"attL2":"attB2");
  const arm1 = sites.role==="donor" ? ATT.L1.indexOf(M1) : 5;
  const arm2 = sites.role==="donor" ? (ATT.L2.length-ATT.L2.indexOf(M2)-15) : 5;
  const s1s=Math.max(1,i1-arm1+1), s1e=i1+20;
  const insS=i1+20+1, insE=i1+20+mid.length;
  const s2s=insE+1, s2e=Math.min(seq.length, insE+5+15+arm2);
  feats.push({type:"misc_recomb",label:name1,start:s1s,end:s1e,strand:1});
  feats.push({type:"CDS",label:insertLabel||"insert",start:insS,end:insE,strand:1});
  feats.push({type:"misc_recomb",label:name2,start:s2s,end:s2e,strand:1});
  feats.sort((a,b)=>a.start-b.start);
  // reciprocal by-product (linear fragment carrying ccdB)
  const byL = sites.role==="donor" ? B1L : ATT.L1.slice(0, ATT.L1.indexOf(M1));
  const byR = sites.role==="donor" ? B2R : ATT.L2.slice(ATT.L2.indexOf(M2)+15);
  const byproduct = byL+M1+s.slice(i1+15,i2)+M2+byR;
  return {seq, features:feats, delta, byproduct,
          site1:{start:s1s,end:s1e,name:name1}, insert:{start:insS,end:insE},
          site2:{start:s2s,end:s2e,name:name2}};
}

/* ============================ primer design (Won Do Heo protocol) ============================ */
const P_TAIL_B1 = "GGGGACAAGTTTGTACAAAAAAGCAGGCTTC";      // GGGG + attB1 + TC
const P_TAIL_B2 = "GGGGACCACTTTGTACAAGAAAGCTGGGT";        // GGGG + attB2 (rev)
const ADAPT_B1  = "GGGGACAAGTTTGTACAAAAAAGCAGGCT";
const ADAPT_B2  = "GGGGACCACTTTGTACAAGAAAGCTGGGT";
const SHORT_B1  = "AAAAAGCAGGCTTC";                        // 12-base adapter-PCR tail
const SHORT_B2  = "AGAAAGCTGGGTG";
const SD_KOZAK  = "GAAGGAGATAGAACCATG";                    // Shine-Dalgarno + Kozak + ATG
const KOZAK     = "ACCATG";
const TEV_FWD   = "GAAAACCTGTATTTTCAGGGCATG";              // ENLYFQG + ATG
const FORMS = {
  A:{side:"B1",add:SD_KOZAK,short:SHORT_B1,
     title:"A — Shine–Dalgarno + Kozak + ATG",
     blurb:"Carries both ribosome-recognition sequences and the start codon, so one clone expresses in E. coli and in eukaryotes. The ATG stays in frame with attB1, keeping an N-terminal fusion possible later."},
  B:{side:"B1",add:KOZAK,short:SHORT_B1,
     title:"B — Kozak + ATG",
     blurb:"Eukaryotic ribosome recognition only. The ATG stays in frame with attB1."},
  C:{side:"B1",add:"",short:SHORT_B1,
     title:"C — N-terminal fusion",
     blurb:"No rrs and no start codon — both come from the destination vector. The gene-specific sequence must continue the attB1 reading frame; including your own ATG is optional."},
  K:{side:"B2",add:"TTA",short:SHORT_B2,
     title:"K — stop codon added",
     blurb:"Adds a stop codon (TAA on the coding strand) so translation terminates before attB2. CTA and TCA work here too."},
  L:{side:"B2",add:"",extraBase:"G",short:SHORT_B2,
     title:"L — C-terminal fusion",
     blurb:"No stop codon, plus one extra base to complete the codon that runs into attB2, so the reading frame carries on into the vector's C-terminal tag."}
};
const MATRIX = {
  ecoli:      {native:["A","K"], nterm:["C","K"], cterm:["A","L"], both:["A","K"]},
  yeast:      {native:["B","K"], nterm:["C","K"], cterm:["B","L"], both:["B","K"]},
  baculo:     {native:["B","K"], nterm:["C","K"], cterm:["B","L"], both:["B","K"]},
  mammalian:  {native:["B","K"], nterm:["C","K"], cterm:["B","L"], both:["B","K"]},
  ybm:        {native:["B","K"], nterm:["C","K"], cterm:["B","L"], both:["B","K"]},
  all:        {native:["A","K"], nterm:["C","K"], cterm:["A","L"], both:["A","K"]}
};
const ORGANISMS={ecoli:"E. coli only",yeast:"Yeast only",baculo:"Baculovirus only",
  mammalian:"Mammalian only",ybm:"Yeast, baculovirus and mammalian",all:"E. coli, yeast, baculovirus and mammalian"};
const FORMATS={native:"Native protein",nterm:"N-terminal fusion",cterm:"C-terminal fusion",both:"Native and N-terminal fusion"};
const STOPS=["TAA","TAG","TGA"];

function pickGsp(seq, fromStart, minLen, maxLen){
  // choose 18-24 nt with the Tm closest to 60 C, preferring a G/C 3' end
  let best=null;
  for(let n=minLen;n<=maxLen;n++){
    const s=fromStart?seq.slice(0,n):seq.slice(seq.length-n);
    if(s.length<n) break;
    const t=tm(s), last=fromStart?s[s.length-1]:s[s.length-1];
    const score=Math.abs(t-60) - (("GC".indexOf(last)>=0)?0.6:0);
    if(!best||score<best.score) best={s,t,score,n};
  }
  return best||{s:seq.slice(0,minLen),t:0,n:minLen};
}
function designProtocolPrimers(cfg){
  const orf=clean(cfg.orf);
  const notes=[];
  const hasStart=orf.slice(0,3)==="ATG";
  const endStop=STOPS.indexOf(orf.slice(-3))>=0;
  const body=(hasStart?orf.slice(3):orf).slice(0, (hasStart?orf.slice(3):orf).length - (endStop?3:0));
  if(!hasStart) notes.push({k:"warn",t:"<b>No ATG at the 5′ end.</b> The primer supplies one; check that this really is your start codon."});
  if(body.length%3) notes.push({k:"bad",t:"<b>The coding sequence is not a multiple of three</b> ("+body.length+" nt after the ATG and stop codon are removed). Fix the ORF before ordering primers — every downstream reading frame depends on it."});
  const pair=MATRIX[cfg.organism][cfg.format];
  const f1=FORMS[pair[0]], f2=FORMS[pair[1]];

  // forward
  const fwdGsp=pickGsp(body,true,18,24);
  const includeAtg = pair[0]==="C" && cfg.cAtg;
  const fAdd = pair[0]==="C" ? (includeAtg?"ATG":"") : f1.add;
  const fTev = cfg.tev && pair[0]==="C" ? TEV_FWD : (cfg.tev ? TEV_FWD : "");
  const fCore = cfg.tev ? TEV_FWD : fAdd;
  const fwd = (cfg.protocol==="adapter" ? SHORT_B1 : P_TAIL_B1) + fCore + fwdGsp.s;
  // stop-codon check at the attB1 junction
  const junctionCodon = (fCore+fwdGsp.s).slice(0,3);
  if(STOPS.indexOf(junctionCodon)>=0)
    notes.push({k:"bad",t:"<b>The codon straight after attB1 is "+junctionCodon+" — a stop codon.</b> Shift the gene-specific sequence by one codon, or include the ATG, so TTA, TAG and TGA cannot form at this junction."});

  // reverse
  const revGspSrc = pair[1]==="K" ? body : body;
  const revPick=pickGsp(revGspSrc,false,18,24);
  const revGsp=rc(revPick.s);
  const rTail=(cfg.protocol==="adapter" ? SHORT_B2 : P_TAIL_B2 + (f2.extraBase||""));
  const rev = rTail + (f2.add||"") + revGsp;

  // top strand between attB1 and attB2
  const mid = "TC" + fCore + body + (pair[1]==="K" ? "TAA" : "C");
  const inFrame = ((ATT.B1.length + mid.length) % 3)===0;

  if(pair[1]==="L"){
    notes.push({k:body.length%3?"bad":"ok",
      t:"<b>C-terminal fusion.</b> The added "+(f2.extraBase||"G")+" completes the codon that runs into attB2 (read as CAC on the coding strand), so the frame carries into the vector tag. The gene-specific sequence must end exactly on a codon boundary."});
  } else {
    notes.push({k:"ok",t:"<b>Stop codon supplied by the reverse primer</b> (TTA on the primer = TAA on the coding strand). Nothing downstream of attB2 is translated."});
  }
  if(cfg.tev) notes.push({k:"ok",t:"<b>TEV site included.</b> Cleavage leaves a single glycine on the N-terminus; replace the ATG with GGC if you would rather have a Met→Gly substitution than an extra residue."});
  if(cfg.protocol==="adapter") notes.push({k:"ok",t:"<b>Adapter PCR.</b> Run a first PCR with these short-tailed gene primers, then a second with the universal adapter primers below. Cheaper and far less prone to primer dimers than full-length attB primers."});

  return {orf, body, hasStart, endStop, pair, f1, f2, fwd, rev, mid, inFrame, notes,
    fwdGsp:fwdGsp.s, revGsp, fwdTm:fwdGsp.t, revTm:revPick.t, fCore,
    fwdParts:[{s:(cfg.protocol==="adapter"?SHORT_B1:P_TAIL_B1),c:"sB"},{s:fCore,c:"sK"},{s:fwdGsp.s,c:"sO"}],
    revParts:[{s:rTail,c:"sB"},{s:(f2.add||""),c:"sK"},{s:revGsp,c:"sO"}]};
}

const state = {

let DB=null, DL=null;

/* ============================ vectors ============================ */
function allVectors(){ return VECTORS.concat(state.custom); }
function getVec(id){ return allVectors().find(v=>v.id===id) || null; }
function vecRec(id){
  const v=getVec(id);

/* ============================ capabilities ============================ */
function boot(){

/* ============================ reactions ============================ */
function midFromAttB(text){
  const p=clean(text);
  const i1=p.indexOf(ATT.B1), i2=p.indexOf(ATT.B2);
  if(i1<0) return {error:"No attB1 site found. The product must contain "+ATT.B1+"."};
  if(i2<0) return {error:"No attB2 site found. The product must contain "+ATT.B2+"."};
  if(i2<=i1+ATT.B1.length) return {error:"attB2 appears before attB1 — check the orientation of your product."};
  return {mid:p.slice(i1+ATT.B1.length,i2)};
}
function midFromAttL(text){
  const s=clean(text);
  const i1=s.indexOf(M1), i2=s.indexOf(M2);
  if(i1<0||i2<0) return {error:"Could not find both att cores. Paste an attL1…attL2 entry cassette, or upload the entry clone file."};
  if(i2<=i1+15) return {error:"att sites are out of order — att1 must come before att2."};
  return {mid:s.slice(i1+20, i2-5)};
}
function reaction(kind){
  const isBP = kind==="BP";
  const c = isBP?state.bp:state.lr;
  let mid=null, design=null, err=null;
  if(isBP){
    if(c.mode==="design"){ design=designProtocolPrimers(c); mid=design.mid; }
    else { const r=midFromAttB(c.product); if(r.error) err=r.error; else mid=r.mid; }
  } else {
    if(c.mode==="carry"){ const b=reaction("BP"); if(b.error) err="Finish the BP reaction first — "+b.error; else mid=b.mid; design=b.design; }
    else { const r=midFromAttL(c.cassette); if(r.error) err=r.error; else mid=r.mid; }
  }
  if(err) return {error:err};
  const vecId = isBP?c.donor:c.dest;
  const vec = getVec(vecId);
  const rec = vecRec(vecId);
  const name = isBP ? ("pENTR-"+(state.bp.name||"insert"))
                    : (String(vecId).replace(/\s*\(.*\)$/,"")+"-"+((state.lr.mode==="carry"?state.bp.name:c.name)||"insert"));
  const cassette = isBP ? (ATT.L1+mid+ATT.L2) : (ATT.B1+mid+ATT.B2);
  let full=null, sites=null, siteWarn=null;
  if(rec){
    sites=findSites(rec);
    if(sites.error) siteWarn=sites.error;
    else if(sites.role!==(isBP?"donor":"dest"))
      siteWarn="This vector reads as a"+(sites.role==="mixed"?" mixed-site":"n "+sites.role)+" vector ("+sites.t1+"/"+sites.t2+" sites), not a "+(isBP?"donor (attP × attP)":"destination (attR × attR)")+" vector.";
    else full=recombine(rec,sites,mid,(isBP?state.bp.name:(state.lr.mode==="carry"?state.bp.name:c.name))||"insert");
  }
  const plasmid = full ? full.seq.length
    : (vec ? vec.size - (vec.cass||0) + cassette.length : cassette.length);
  return {kind, mid, design, vec, rec, sites, siteWarn, full, cassette, plasmid, name, insertName:(isBP?state.bp.name:(state.lr.mode==="carry"?state.bp.name:c.name))};
}

function bundleFor(r){
  const base=slug(r.name);
  const seq = r.full ? r.full.seq : r.cassette;
  const feats = r.full ? r.full.features : (r.kind==="BP"
      ? [{type:"misc_recomb",label:"attL1",start:1,end:100,strand:1},
         {type:"CDS",label:r.insertName||"insert",start:101,end:100+r.mid.length,strand:1},
         {type:"misc_recomb",label:"attL2",start:101+r.mid.length,end:200+r.mid.length,strand:1}]
      : [{type:"misc_recomb",label:"attB1",start:1,end:25,strand:1},
         {type:"CDS",label:r.insertName||"insert",start:26,end:25+r.mid.length,strand:1},
         {type:"misc_recomb",label:"attB2",start:26+r.mid.length,end:50+r.mid.length,strand:1}]);
  const gb=toGenBank({name:base, desc:(r.kind==="BP"?"Gateway entry clone":"Gateway expression clone")+
    " — "+(r.insertName||"insert")+" in "+(r.vec?r.vec.id:"vector"), seq, features:feats,
    topology:r.full?"circular":"linear"});
  const files=[{name:base+".gb", text:gb},{name:base+".fasta", text:toFastaText(base,seq)}];
  if(r.design){
    files.push({name:base+"-primers.csv", text:
      "name,sequence,length,tm_gsp_c,form,note\n"+
      '"'+base+'_attB1_F","'+r.design.fwd+'",'+r.design.fwd.length+","+r.design.fwdTm.toFixed(1)+","+r.design.pair[0]+',"'+FORMS[r.design.pair[0]].title.replace(/"/g,"")+'"\n'+
      '"'+base+'_attB2_R","'+r.design.rev+'",'+r.design.rev.length+","+r.design.revTm.toFixed(1)+","+r.design.pair[1]+',"'+FORMS[r.design.pair[1]].title.replace(/"/g,"")+'"\n'+
      (state.bp.protocol==="adapter"
        ? '"adapter_attB1","'+ADAPT_B1+'",'+ADAPT_B1.length+',,"universal adapter primer"\n'+
          '"adapter_attB2","'+ADAPT_B2+'",'+ADAPT_B2.length+',,"universal adapter primer"\n' : "")+
      SEQ_PRIMERS.map(p=>'"'+p.name+'","'+p.seq+'",'+p.seq.length+',,"'+p.note+'"').join("\n")+"\n"});
  }
  files.push({name:"README.txt", text:
    "Gateway Bench export\n====================\n\n"+
    "Construct : "+r.name+"\n"+
    "Reaction  : "+r.kind+" ("+(r.kind==="BP"?"attB x attP -> attL + attR":"attL x attR -> attB + attP")+")\n"+
    "Vector    : "+(r.vec?r.vec.id:"(none)")+"\n"+
    "Insert    : "+(r.insertName||"insert")+", "+r.mid.length+" bp between the att cores\n"+
    "Length    : "+seq.length+" bp "+(r.full?"(complete recombined plasmid)":"(cassette only — no vector sequence was supplied)")+"\n"+
    "Generated : "+new Date().toISOString()+"\n\n"+
    (r.full?"":"To get the complete plasmid, add the vector's GenBank file on the Vector library tab and run the reaction again.\n")});
  return {base, files, seq, gb};
}
function saveFile(filename, data){

function saveRun(r){
  if(!DB){ flash("History needs the artifact's data store, which is not available in this view.","bad"); return; }
  const id=String(Date.now())+"-"+Math.random().toString(36).slice(2,7);
  const doc={kind:r.kind, name:r.name, insert:r.insertName||"insert", vector:r.vec?r.vec.id:"(none)",
    insertBp:r.mid.length, plasmidBp:r.plasmid, complete:!!r.full,
    mid:r.mid.slice(0,60000), createdAt:new Date().toISOString(),
    format:r.kind==="BP"?state.bp.format:"", organism:r.kind==="BP"?state.bp.organism:"",
    fwd:r.design?r.design.fwd:"", rev:r.design?r.design.rev:""};

    state.history.unshift(Object.assign({docId:id},doc)); flash("Saved to history","ok");
  }).catch(e=>flash(e&&e.code==="invalid_argument"

function restoreRun(h){

  else { state.lr.mode="paste"; state.lr.cassette=ATT.L1+h.mid+ATT.L2; state.lr.name=h.insert; switchTab("lr"); }
}

function saveCustomVector(){
  const d=state.lib.draft;
  if(!d.name){ flash("Give the vector a name first.","bad"); return; }
  const id=slug(d.name);
  const doc={name:d.name, addgene:d.addgene||"", kind:d.kind, app:d.app, size:d.rec?d.rec.seq.length:(d.size||0),
    cass:d.cass||0, bact:d.bact||"—", sel:d.sel||"—", prom:d.prom||"—", tag:d.tag||"none", tagpos:d.tagpos||"none",
    att:d.att||"—", src:d.addgene?("Addgene #"+d.addgene):"user upload", note:d.note||"",
    seq:d.rec?d.rec.seq:"", features:d.rec?d.rec.features.slice(0,300):[], topology:d.rec?d.rec.topology:"circular"};
  if(JSON.stringify(doc).length>240000){ flash("That sequence is too large to store (256 KB limit per vector).","bad"); return; }
  if(!DB){
    state.custom.push(Object.assign({custom:true,id,session:true},doc));
    state.lib.adding=false; state.lib.sel=id;
    flash("Added for this session only — the data store is unavailable, so it will not persist.","warn");
    rerenderAll(); return;
  }
  DB.collection("vectors").doc(id).set(doc).then(()=>{
    state.custom=state.custom.filter(v=>v.id!==id);
    state.custom.push(Object.assign({custom:true,id},doc));
    state.lib.adding=false; state.lib.sel=id;
    flash("Added "+d.name+" to the library","ok"); rerenderAll();
  }).catch(e=>flash(e&&e.code==="invalid_argument"
    ? "You have read-only access to this page, so the library cannot be changed."
    : "Could not save the vector.","bad"));
}
function deleteCustomVector(id){
  if(!DB){ state.custom=state.custom.filter(v=>v.id!==id); rerenderAll(); return; }
  DB.collection("vectors").doc(id).delete().then(()=>{
    state.custom=state.custom.filter(v=>v.id!==id);
    if(state.lib.sel===id) state.lib.sel="pDONR221";
    rerenderAll();
  }).catch(()=>flash("Could not remove that vector.","bad"));
}
function readFile(file, cb){
  const fr=new FileReader();
  fr.onload=()=>cb(null,String(fr.result));
  fr.onerror=()=>cb(new Error("read failed"));
  fr.readAsText(file);
}
function handleSeqFile(file, target){
  if(/\.dna$/i.test(file.name)){
    flash("SnapGene .dna files are binary — open it in SnapGene and export as GenBank (.gb) first.","bad"); return;
  }
  readFile(file,(err,text)=>{
    if(err){ flash("Could not read that file.","bad"); return; }
    const recs=parseSeqFile(file.name,text);
    if(!recs.length){ flash("No sequence found in "+file.name+" — expected FASTA, GenBank or plain sequence.","bad"); return; }
    const rec=recs[0];
    if(target==="orf"){
      state.bp.orf=rec.seq; state.bp.name=rec.name||state.bp.name; state.bp.mode="design";
      flash("Loaded "+rec.name+" — "+bp(rec.seq.length),"ok");
    } else if(target==="entry"){
      state.lr.mode="paste"; state.lr.cassette=rec.seq; state.lr.name=rec.name||state.lr.name;
      flash("Loaded "+rec.name+" — "+bp(rec.seq.length),"ok");
    } else {
      const d=state.lib.draft;
      d.rec=rec; d.name=d.name||rec.name;
      const s=findSites(rec);
      if(s.error){ d.att="—"; flash("Loaded "+bp(rec.seq.length)+", but no Gateway att sites were found: "+s.error,"warn"); }
      else {
        d.rec=s.rec; d.kind = s.role==="donor"?"donor":s.role==="entry"?"entry":s.role==="dest"?"dest":d.kind;
        d.att="att"+s.t1+"1 / att"+s.t2+"2"; d.cass=s.cassetteBp;
        const ccdb=/ATGCAGTTTAAGGTTTACACCTATAAAAGA/.test(rec.seq);
        const labels=(rec.features||[]).map(f=>String(f.label||"").toLowerCase());
        const find=(re)=>{const f=(rec.features||[]).find(x=>re.test(String(x.label||"")));return f?f.label:null;};
        d.bact = find(/^(AmpR|bla|Amp)/i)?"Ampicillin" : find(/KanR|nptII|neo/i)?"Kanamycin"
               : find(/SmR|SpecR|aadA/i)?"Spectinomycin" : find(/GmR|aacC1/i)?"Gentamicin" : d.bact;
        d.prom = find(/CMV|EF-1|EF1|PGK|T7|SV40|35S|TRE|UBC|ADH1|polyhedrin/i) || d.prom;
        d.note = (d.note||"") + (ccdb?" ccdB cassette detected in the uploaded sequence.":"");
        flash("Read "+bp(rec.seq.length)+" · "+(rec.features||[]).length+" features · "+
              (s.role==="mixed"?"mixed att sites":s.role+" vector")+" ("+d.att+")"+(ccdb?" · ccdB present":""),"ok");
      }
      state.lib.adding=true;
    }
    rerenderAll();
  });
}

      '<span><i style="background:var(--rrs-bg);border:1px solid var(--rrs)"></i>rrs / start / stop</span>'+
      '<span><i style="background:var(--orf-bg);border:1px solid var(--orf)"></i>gene-specific (18–24 nt)</span></div>'+
      (c.protocol==="adapter"
        ? '<div class="stack" style="gap:7px"><b>Universal adapter primers — second PCR</b>'+
          '<div class="row"><span class="pill">attB1</span><span class="mono" style="font-size:12px">'+ADAPT_B1+"</span>"+copyBtn("p-ad1")+"</div>"+
          '<div class="row"><span class="pill">attB2</span><span class="mono" style="font-size:12px">'+ADAPT_B2+"</span>"+copyBtn("p-ad2")+"</div>"+
          '<textarea id="p-ad1" hidden>'+ADAPT_B1+'</textarea><textarea id="p-ad2" hidden>'+ADAPT_B2+"</textarea>"+
          '<p class="hint">Amplify with the gene primers above (15–20 cycles), then amplify that product with these two adapter primers to build the full attB sites.</p></div>' : "")+
      d.notes.map(n=>'<div class="note '+n.k+'">'+n.t+"</div>").join("")+
      '<ul class="tight"><li>Keep the gene-specific portion 18–24 nt; the attB tail contributes almost nothing to annealing.</li>'+
      "<li>Use a proofreading polymerase and gel- or column-purify the product — a single indel in the core kills recombination.</li>"+
      "<li>TTA, TAG and TGA must not form at the attB1 junction; the tool checks this for you.</li></ul>"+
      "</div></div>";
  }

  right+=productPanel(r);
  right+='<div class="panel"><div class="panel-hd"><h2>'+(r.full?"Entry clone sequence":"Entry cassette sequence")+
    '</h2><span class="spacer"></span><span class="pill">'+bp(r.full?r.full.seq.length:r.cassette.length)+"</span>"+
    copyBtn("seq-entry")+'</div><div class="panel-bd stack">'+
    (r.full
      ? renderSeq([{seq:r.full.seq.slice(0,Math.max(0,r.full.site1.start-1)),cls:"sX"},
                   {seq:r.full.seq.slice(r.full.site1.start-1,r.full.site1.end),cls:"sL"},
                   {seq:r.full.seq.slice(r.full.insert.start-1,r.full.insert.end),cls:"sO"},
                   {seq:r.full.seq.slice(r.full.site2.start-1,r.full.site2.end),cls:"sL"},
                   {seq:r.full.seq.slice(r.full.site2.end),cls:"sX"}],60,4200)
      : renderSeq([{seq:ATT.L1,cls:"sL"},{seq:r.mid,cls:"sO"},{seq:ATT.L2,cls:"sL"}]))+
    '<textarea id="seq-entry" hidden>'+(r.full?r.full.seq:r.cassette)+"</textarea>"+
    '<p class="hint">Teal = attL sites · blue = your insert'+(r.full?" · grey = donor backbone":"")+".</p>"+
    "</div></div>";

  right+='<div class="panel"><div class="panel-hd"><h2>Sequencing primers</h2></div><div class="panel-bd stack">'+
    SEQ_PRIMERS.map((p,i)=>'<div class="row" style="justify-content:space-between"><span><b>'+esc(p.name)+"</b> "+
      '<span class="hint">'+esc(p.note)+'</span></span><span class="row"><span class="mono" style="font-size:12px">'+p.seq+"</span>"+
      copyBtn("sp"+i)+'</span><textarea id="sp'+i+'" hidden>'+p.seq+"</textarea></div>").join("")+
    "</div></div>";

  right+='<div class="panel"><div class="panel-hd"><h2>Bench protocol</h2></div><div class="panel-bd stack">'+
    '<ol class="proto">'+
    "<li>Combine <b>15–150 ng</b> attB PCR product (1–7 µL), <b>150 ng</b> "+esc(c.donor)+" and TE pH 8.0 to <b>8 µL</b>.</li>"+
    "<li>Thaw BP Clonase II on ice, vortex twice for 2 s, add <b>2 µL</b> and mix.</li>"+
    "<li>Incubate <b>1 h at 25 °C</b> — overnight for inserts over 5 kb or low yields.</li>"+
    "<li>Add <b>1 µL proteinase K</b>, 10 min at 37 °C.</li>"+
    "<li>Transform into a <b>ccdB-sensitive</b> strain (DH5α, TOP10, Mach1) and plate on "+esc(donor?donor.bact:"the donor marker")+".</li>"+
    "<li>Sequence across both junctions with SeqL-A and SeqL-B before going on to the LR reaction.</li>"+
    "</ol>"+
    '<div class="note warn"><b>ccdB is the counter-selection.</b> Propagate the donor vector itself only in DB3.1 or ccdB Survival 2 T1<sup>R</sup>. Background colonies almost always mean a ccdB-resistant host.</div>'+
    "</div></div>";
  return '<div class="split"><div>'+left+"</div><div>"+msgBar()+right+"</div></div>";
}

/* ============================ LR view ============================ */
function viewLR(){
  const c=state.lr, r=reaction("LR");
  const dest=getVec(c.dest);
  let left='<div class="panel"><div class="panel-hd"><h2>1 · Entry clone</h2></div><div class="panel-bd stack">'+
    '<div class="seg" role="group" aria-label="Entry clone source">'+
      '<button data-lrmode="carry" aria-pressed="'+(c.mode==="carry")+'">Use BP product</button>'+
      '<button data-lrmode="paste" aria-pressed="'+(c.mode==="paste")+'">Paste or upload entry clone</button>'+
    "</div>";
  if(c.mode==="carry"){
    left+='<p class="hint">Reading the entry clone built on the BP tab. Change the insert there and this follows.</p>'+
      '<label class="fld">Insert name<input type="text" id="lrName" value="'+esc(state.bp.name)+'"></label>';
  } else {
    left+='<label class="fld">Entry clone or attL cassette<textarea id="lrCass" spellcheck="false" placeholder="CAAATAATGATTTTATTTTGACTGATAGTG… attL1 … insert … attL2">'+esc(c.cassette)+"</textarea></label>"+
      '<label class="file"><input type="file" id="lrFile" accept=".fa,.fasta,.gb,.gbk,.txt,.seq"><span>⤒ Upload FASTA or GenBank</span></label>'+
      '<p class="hint">A whole entry plasmid works — the tool finds the att cores itself.</p>'+
      '<label class="fld">Insert name<input type="text" id="lrName" value="'+esc(c.name)+'"></label>';
  }
  left+="</div></div>";
  left+='<div class="panel"><div class="panel-hd"><h2>2 · Destination vector</h2></div><div class="panel-bd stack">'+
    '<label class="fld">Destination (attR × attR)<select id="lrDest">'+vecOptions("dest",c.dest)+"</select></label>"+
    (dest?'<dl class="kv"><dt>Host</dt><dd>'+esc(APPNAMES[dest.app]||dest.app)+"</dd>"+
      "<dt>Promoter</dt><dd>"+esc(dest.prom)+"</dd>"+
      "<dt>Tag</dt><dd>"+esc(dest.tag)+(dest.tagpos!=="none"?" ("+dest.tagpos+"-terminal)":"")+"</dd>"+
      "<dt>E. coli</dt><dd>"+esc(dest.bact)+"</dd><dt>Host sel.</dt><dd>"+esc(dest.sel)+"</dd>"+
      '<dt>Size</dt><dd class="mono">'+bp(dest.size)+"</dd>"+
      (dest.seq?'<dt>Sequence</dt><dd class="mono">loaded ✓</dd>':"")+"</dl>"+
      '<p class="hint">'+esc(dest.note||"")+"</p>":"")+
    "</div></div>";

  let right="";
  if(r.error){
    right='<div class="panel"><div class="panel-bd"><div class="note bad"><b>Cannot run the reaction.</b><br>'+esc(r.error)+"</div></div></div>";
    return '<div class="split"><div>'+left+"</div><div>"+msgBar()+right+"</div></div>";
  }
  right='<div class="panel"><div class="panel-hd"><h2>LR reaction</h2><span class="spacer"></span>'+
    '<span class="pill">LR Clonase II · Int + IHF + Xis</span></div><div class="panel-bd stack">'+
    '<div class="eq">'+
      '<div class="box"><div class="t">entry clone</div><div class="v"><span class="chip c-L">attL1</span> insert <span class="chip c-L">attL2</span></div></div>'+
      '<span class="op">×</span>'+
      '<div class="box"><div class="t">destination</div><div class="v"><span class="chip c-R">attR1</span> '+esc(c.dest)+' <span class="chip c-R">attR2</span></div></div>'+
      '<span class="op">→</span>'+
      '<div class="box"><div class="t">expression clone</div><div class="v"><span class="chip c-B">attB1</span> insert <span class="chip c-B">attB2</span></div></div>'+
      '<span class="op">+</span>'+
      '<div class="box"><div class="t">by-product</div><div class="v"><span class="chip c-P">attP1</span> ccdB <span class="chip c-P">attP2</span></div></div>'+
    "</div>"+
    '<div class="note ok"><b>attL × attR → attB + attP.</b> Excisionase drives the reverse of BP: the insert moves into the destination backbone and the ccdB cassette leaves on the attP by-product.</div>'+
    "</div></div>";
  right+=productPanel(r);

  // reading frame
  const expr=ATT.B1+r.mid+ATT.B2;
  const prot=translate(expr);
  const stopAt=prot.indexOf("*");
  const b1pep=translate(ATT.B1);
  const junctionCodons=Math.floor((ATT.B1.length+r.mid.length)/3);
  const offset=(ATT.B1.length+r.mid.length)%3;
  const junctionCodon=offset===1?(r.mid.slice(-1)+ATT.B2.slice(0,2)):null;
  const inFrameB2=offset===1;
  const notes=[];
  notes.push({k:b1pep.indexOf("TSLYKKAG")===0?"ok":"warn",
    t:"<b>attB1 peptide:</b> <span class=\"mono\">"+esc(b1pep)+"</span> — the scar between an N-terminal tag and your first residue. The attB1 primer sets this frame, so no offset guessing is needed."});
  if(dest&&dest.tagpos==="N"){
    notes.push({k:(stopAt<0||stopAt*3>=ATT.B1.length)?"ok":"bad",
      t:"<b>N-terminal "+esc(dest.tag)+" fusion:</b> the insert must have no ATG of its own and must continue the attB1 frame. "+
        (stopAt<0?"No in-frame stop before attB2.":"First in-frame stop at codon "+(stopAt+1)+".")});
  }
  if(dest&&dest.tagpos==="C"){
    notes.push({k:inFrameB2?"ok":"bad",
      t:inFrameB2
        ? "<b>C-terminal "+esc(dest.tag)+" fusion: frame carries through.</b> The last base of the insert plus the first two of attB2 make the codon <span class=\"mono\">"+esc(junctionCodon)+"</span> ("+translate(junctionCodon)+"), exactly the geometry reverse primer form L is built for."
        : "<b>C-terminal "+esc(dest.tag)+" fusion: frame is wrong.</b> The insert ends "+(offset===0?"flush with a codon boundary":"two bases into a codon")+", so the tag would be translated "+(offset===0?"+1":"−1")+" base out of frame. Rebuild the insert with reverse primer form L, which adds the one base that completes the codon running into attB2."});
    notes.push({k:(stopAt<0||stopAt>=junctionCodons)?"ok":"bad",
      t:(stopAt<0||stopAt>=junctionCodons)
        ? "<b>No premature stop</b> — translation reaches attB2 and carries on into the tag."
        : "<b>Stop codon at codon "+(stopAt+1)+"</b> ends translation before attB2, so the C-terminal tag will not be made. Rebuild the insert with reverse primer form L (C-terminal fusion)."});
  }
  if(!dest||dest.tagpos!=="C"){
    notes.push({k:"ok",t:"<b>Translation stops inside the insert</b>"+(stopAt<0?" — no in-frame stop was found, so the ribosome will read into attB2 and beyond.":" at codon "+(stopAt+1)+", "+(junctionCodons-stopAt)+" codons before attB2. Nothing downstream of the insert is translated.")});
  }
  if(dest&&dest.tagpos==="none"){
    notes.push({k:r.mid.indexOf("ATG")>=0?"ok":"warn",
      t:"<b>Untagged vector</b> — the insert must supply its own start codon"+(dest.app==="bacterial"?" and a ribosome-binding site (primer form A)":"")+"."});
  }
  const shown=prot.slice(0,stopAt<0?prot.length:stopAt);
  right+='<div class="panel"><div class="panel-hd"><h2>Reading-frame check</h2><span class="spacer"></span>'+
    '<span class="pill'+(offset===1?" on":"")+'">'+(offset===1?"read-through frame ✓":offset===0?"terminates at attB2":"frame shifted")+'</span></div><div class="panel-bd stack">'+
    notes.map(n=>'<div class="note '+n.k+'">'+n.t+"</div>").join("")+
    '<div><div class="row" style="justify-content:space-between"><b>Predicted translation from attB1</b>'+
    '<span class="row"><span class="pill">'+shown.length+' aa</span>'+copyBtn("aa-prot")+"</span></div>"+
    '<div class="seqwrap"><div class="aa">'+esc(shown.replace(/(.{10})/g,"$1 "))+"</div></div>"+
    '<textarea id="aa-prot" hidden>'+shown+"</textarea></div>"+
    "</div></div>";

  right+='<div class="panel"><div class="panel-hd"><h2>'+(r.full?"Expression clone sequence":"Expression cassette sequence")+
    '</h2><span class="spacer"></span><span class="pill">'+bp(r.full?r.full.seq.length:expr.length)+"</span>"+
    copyBtn("seq-expr")+'</div><div class="panel-bd stack">'+
    (r.full
      ? renderSeq([{seq:r.full.seq.slice(0,Math.max(0,r.full.site1.start-1)),cls:"sX"},
                   {seq:r.full.seq.slice(r.full.site1.start-1,r.full.site1.end),cls:"sB"},
                   {seq:r.full.seq.slice(r.full.insert.start-1,r.full.insert.end),cls:"sO"},
                   {seq:r.full.seq.slice(r.full.site2.start-1,r.full.site2.end),cls:"sB"},
                   {seq:r.full.seq.slice(r.full.site2.end),cls:"sX"}],60,4200)
      : renderSeq([{seq:ATT.B1,cls:"sB"},{seq:r.mid,cls:"sO"},{seq:ATT.B2,cls:"sB"}]))+
    '<textarea id="seq-expr" hidden>'+(r.full?r.full.seq:expr)+"</textarea>"+
    '<p class="hint">Amber = attB sites (25 bp each) · blue = your insert'+(r.full?" · grey = destination backbone":"")+".</p>"+
    "</div></div>";

  right+='<div class="panel"><div class="panel-hd"><h2>Bench protocol</h2></div><div class="panel-bd stack">'+
    '<ol class="proto">'+
    "<li>Combine <b>50–150 ng</b> entry clone, <b>150 ng</b> "+esc(c.dest)+" and TE pH 8.0 to <b>8 µL</b>.</li>"+
    "<li>Add <b>2 µL LR Clonase II</b> (vortexed twice, kept on ice) and mix.</li>"+
    "<li>Incubate <b>1 h at 25 °C</b>"+(dest&&dest.size>10000?" — use <b>overnight at 25 °C</b> for this vector; large destinations recombine slowly.":" — overnight for larger constructs.")+"</li>"+
    "<li>Add <b>1 µL proteinase K</b>, 10 min at 37 °C.</li>"+
    "<li>Transform into a ccdB-sensitive strain"+(dest&&(dest.app==="lentiviral"||dest.app==="retroviral")?" (use a <b>recombination-deficient</b> host such as Stbl3 — LTRs are unstable in DH5α)":"")+
      " and select on "+esc(dest?dest.bact:"the vector marker")+".</li>"+
    "<li>Verify both attB junctions by sequencing before moving into cells.</li></ol>"+
    (dest&&(dest.app==="lentiviral"||dest.app==="retroviral"||dest.app==="adenoviral")
      ? '<div class="note warn"><b>Viral backbone.</b> Grow at 30 °C in a recombination-deficient strain and check the LTRs or ITRs by restriction digest.</div>':"")+
    (dest?'<div class="note"><b>Entry and destination must carry different markers.</b> '+esc(dest.id)+" is "+esc(dest.bact)+".</div>":"")+
    "</div></div>";
  return '<div class="split"><div>'+left+"</div><div>"+msgBar()+right+"</div></div>";
}

/* ============================ library view ============================ */
function viewLib(){
